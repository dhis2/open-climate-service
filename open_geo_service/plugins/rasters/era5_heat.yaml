- id: era5heat_utci_daily
  name: Universal Thermal Climate Index (ERA5-Heat, daily average)
  short_name: UTCI
  variable: utci
  description: >-
    Daily mean of the Universal Thermal Climate Index (UTCI): how hot or cold the outdoors feels
    to the body, from air temperature, humidity, wind and radiation. At 0.25 degrees (about 28 km)
    worldwide, aggregated from the hourly CDS ARCO archive. Days run in UTC.
  period_type: daily
  sync:
    kind: temporal
    execution: append
  extents:
    spatial:
      bbox: [-180, -90, 180, 90]
    temporal:
      begin: "1940-01-02"
      resolution: P1D
  ingestion:
    plugin: open_geo_service.plugins.rasters.era5_heat.ERA5HeatDailyUTCIPlugin
    params: 
      temporal_aggregation: mean
  units: degC
  cell_methods: "time: mean"
  resolution: 0.25 deg x 0.25 deg
  source: ERA5-Heat
  source_url: https://cds.climate.copernicus.eu/datasets/derived-utci-historical?tab=overview
  license:
    name: Licence to Use Copernicus Products
    url: https://apps.ecmwf.int/datasets/licences/copernicus/
  providers:
    - name: Copernicus Climate Change Service (C3S)
      url: https://climate.copernicus.eu/
  display:
    colormap: YlOrRd

