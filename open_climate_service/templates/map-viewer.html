<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Map viewer — {{ name }}</title>
    <link href="https://unpkg.com/maplibre-gl@6.7.0/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 15px;
        color: #1a2332;
      }

      .layout {
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      header {
        background: #1a2332;
        color: #fff;
        padding: 0.85rem 1.5rem;
        display: flex;
        align-items: center;
        gap: 1rem;
        flex-shrink: 0;
        z-index: 10;
      }
      header h1 {
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      header h1 a {
        color: inherit;
        text-decoration: none;
      }
      header h1 a:hover {
        text-decoration: underline;
      }
      header .subtitle {
        font-size: 0.825rem;
        color: #8fa3b8;
      }
      .map-container {
        position: relative;
        flex: 1;
      }

      #map {
        position: absolute;
        inset: 0;
      }

      .panel {
        position: absolute;
        top: 1rem;
        left: 1rem;
        width: 272px;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 1rem 1.25rem;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        z-index: 5;
        display: flex;
        flex-direction: column;
        gap: 0.9rem;
      }

      .panel-section label {
        font-size: 0.72rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: #64748b;
        display: block;
        margin-bottom: 0.4rem;
      }

      select {
        width: 100%;
        padding: 0.4rem 0.6rem;
        border: 1px solid #cbd5e1;
        border-radius: 5px;
        font-size: 0.875rem;
        background: #fff;
        color: #1a2332;
        cursor: pointer;
      }
      select:focus {
        outline: 2px solid #0066cc;
        outline-offset: 1px;
      }

      .time-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 0.4rem;
      }
      .time-value {
        font-size: 0.825rem;
        font-family: ui-monospace, "Cascadia Code", monospace;
        color: #1a2332;
      }
      .time-count {
        font-size: 0.75rem;
        color: #94a3b8;
        font-family: ui-monospace, "Cascadia Code", monospace;
      }

      input[type="range"] {
        width: 100%;
        accent-color: #0066cc;
        cursor: pointer;
      }

      .meta-grid {
        display: grid;
        grid-template-columns: max-content 1fr;
        column-gap: 0.75rem;
        row-gap: 0.2rem;
        font-size: 0.8rem;
        border-top: 1px solid #f1f5f9;
        padding-top: 0.75rem;
      }
      .meta-grid dt {
        color: #64748b;
      }
      .meta-grid dd {
        color: #1a2332;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .meta-description {
        font-size: 0.78rem;
        line-height: 1.45;
        color: #475569;
        margin: 0.6rem 0 0;
        /* Caveats run long — RWI's is several sentences — so cap the height and scroll rather
           than letting one dataset push the legend and controls off the panel. */
        max-height: 8.5rem;
        overflow-y: auto;
      }

      .status {
        font-size: 0.8rem;
        color: #64748b;
        font-style: italic;
      }
      .status.error {
        color: #b91c1c;
        font-style: normal;
      }

      .hidden {
        display: none !important;
      }

      .legend-bar {
        height: 10px;
        border-radius: 3px;
        margin-bottom: 0.3rem;
      }
      .legend-labels {
        display: flex;
        justify-content: space-between;
        font-size: 0.75rem;
        font-family: ui-monospace, "Cascadia Code", monospace;
        color: #475569;
      }
      .legend-units {
        font-size: 0.72rem;
        color: #94a3b8;
        text-align: center;
        margin-top: 0.2rem;
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <header>
        <h1><a href="{{ mount }}/">{{ name }}</a></h1>
        <span class="subtitle">Map viewer</span>
      </header>

      <div class="map-container">
        <div id="map"></div>

        <div class="panel">
          <div class="panel-section">
            <label for="dataset-select">Dataset</label>
            <select id="dataset-select">
              <option value="">Select dataset...</option>
            </select>
          </div>

          <!-- One control per non-spatial dimension, generated in JS:
               a slider for temporal/regular-ordinal axes, a dropdown for
               categorical/irregular ones (see controlForDim). -->
          <div id="dim-controls" class="panel-section hidden"></div>

          <dl id="dataset-meta" class="meta-grid hidden">
            <dt>Source</dt>
            <dd id="meta-source">—</dd>
            <dt id="meta-units-label">Units</dt>
            <dd id="meta-units">—</dd>
            <dt>Licence</dt>
            <dd id="meta-licence">—</dd>
          </dl>
          <p id="meta-description" class="meta-description hidden"></p>

          <div id="legend" class="panel-section hidden">
            <label>Legend</label>
            <div id="legend-bar" class="legend-bar"></div>
            <div class="legend-labels">
              <span id="legend-min"></span>
              <span id="legend-max"></span>
            </div>
            <div id="legend-units" class="legend-units"></div>
          </div>

          <div id="status" class="status">Loading datasets...</div>
        </div>
      </div>
    </div>

    <script type="module">
      // MapLibre 6 is ESM-only (no UMD `dist/maplibre-gl.js`), so import it as a
      // namespace. Load the official dist `.mjs` from unpkg — NOT esm.sh: MapLibre's
      // worker is a real sibling URL (`./maplibre-gl-worker.mjs`) resolved from
      // import.meta.url, and esm.sh's transformed build doesn't serve it (404), which
      // blanks the map. unpkg serves the worker + shared chunk siblings with CORS.
      import * as maplibregl from "https://unpkg.com/maplibre-gl@6.7.0/dist/maplibre-gl.mjs";
      // 0.8.0 onwards reads the GeoZarr `spatial:*` attributes (`spatial:dimensions`,
      // `spatial:shape`, `spatial:transform`) rather than inferring geometry from the
      // coordinate arrays. That is the behaviour we want: placement comes from the store,
      // not from a guess, and not from our own catalogue passed in by hand.
      //
      // It also means the store has to be right. One that declares its axes transposed —
      // `["x","y"]` with a shape of `[x, y]` on a `(t, y, x)` array — renders as diagonal
      // streaks in offset blocks, because that is what it asked for. Stores written before
      // the CLIM-852 fix (2026-08-05) do exactly that, and 0.6.1 concealed it by ignoring
      // these attributes altogether. Those stores get reingested rather than patched in
      // place — CLIM-1008 records that decision, and which stores were affected.
      //
      // Two stores on the same grid and CRS, same 388x299 chunking over 1550x1195,
      // differing only in when they were written, are what establish this is metadata
      // rather than the library:
      //
      //   senorge_temperature_daily   (2026-06-26, ["x","y"]) -> streaks
      //   senorge_precipitation_daily (2026-08-06, ["y","x"]) -> correct
      //
      // No upstream bug is involved; an earlier report of one was withdrawn
      // (carbonplan/zarr-layer#88). CLIM-1006 (CHIRPS3 streaks on the Rwanda instance) was
      // reported against 0.6.1, which never read these attributes, so it is a separate
      // fault and still open.
      import { ZarrLayer } from "https://esm.sh/@carbonplan/zarr-layer@0.9.1";
      import chroma from "https://esm.sh/chroma-js@3.2.0";

      // Suffix _r means the scale is reversed (matplotlib convention).
      // chroma-js resolves ColorBrewer/D3 scale names case-insensitively.
      function buildColormap(name = "viridis") {
        const reversed = name.endsWith("_r");
        const scaleName = reversed ? name.slice(0, -2) : name;
        try {
          const colors = chroma.scale(scaleName).colors(256);
          return reversed ? colors.reverse() : colors;
        } catch {
          return chroma.scale("viridis").colors(256);
        }
      }

      // A true-colour render, or null for the ordinary colormapped case.
      //
      // The bands are selected by *index*, not by name, and no version of the library changes
      // that: the band coordinate is a Zarr v3 fixed-length UTF-32 string array, which has no
      // v3 specification and which the JS reader does not load, so a band *name* has nothing
      // to resolve against. What changed is the failure. 0.6.1 resolved every unreadable name
      // to index 0, so all three samplers read the same band and the composite rendered grey —
      // a plausible image of the wrong data. From 0.9.1 (carbonplan/zarr-layer#87) it refuses,
      // and its message names the remedy this already uses: "the coordinate array could not be
      // read ... Use { selected: <index>, type: 'index' } to select by array index instead."
      //
      // The collection already publishes the axis values, so the mapping is resolved here and
      // passed as `{selected: [...], type: "index"}` — the form the library documents for a
      // multi-band selector, and the one whose shader names `bandIdentifier` mirrors.
      function readRgbRender(renders, dimensions) {
        const bands = renders.bands;
        // No `bands` at all is the ordinary colormapped case, not a failure — return null
        // quietly and let the caller take the ramp path. Every refusal *after* this point
        // explains itself, because the caller stops loading once `bands` was declared.
        if (!Array.isArray(bands)) return null;
        if (bands.length !== 3) {
          setStatus(`Cannot composite: expected 3 bands, the collection declares ${bands.length}.`, true);
          return null;
        }
        const rescale = Array.isArray(renders.rescale) ? renders.rescale : [];
        if (rescale.length !== 3) {
          setStatus(`Cannot composite: expected 3 rescale pairs, the collection declares ${rescale.length}.`, true);
          return null;
        }
        // Prefer the dimension the collection names; otherwise find the one whose values
        // contain all three bands, so a store using a different axis name still works.
        const declared = renders["open_climate_service:band_dimension"];
        const byValues = Object.entries(dimensions ?? {}).find(
          ([, v]) => Array.isArray(v.values) && bands.every((b) => v.values.includes(b)),
        )?.[0];
        const dimension = declared && dimensions?.[declared] ? declared : (byValues ?? declared ?? "band");
        const values = dimensions?.[dimension]?.values;
        if (!Array.isArray(values)) {
          setStatus(`Cannot composite: dimension '${dimension}' publishes no values to map bands onto.`, true);
          return null;
        }
        const indices = bands.map((b) => values.indexOf(b));
        if (indices.some((i) => i < 0)) {
          setStatus(`Cannot composite: bands ${JSON.stringify(bands)} are not all in '${dimension}'.`, true);
          return null;
        }
        return { bands, rescale, dimension, indices };
      }

      // zarr-layer blends with premultiplied alpha and, once a customFrag is supplied, the
      // shader owns discarding: fill pixels arrive as NaN rather than being dropped for us.
      // Each band is stretched by its own rescale pair, which is why per-band ranges exist.
      // zarr-layer replaces any character that is not a letter, digit or underscore with an
      // underscore and prefixes a leading digit, so the shader has to refer to the sanitised
      // names rather than the raw band labels.
      function glslName(band) {
        const safe = String(band).replace(/[^A-Za-z0-9_]/g, "_");
        return /^[0-9]/.test(safe) ? `_${safe}` : safe;
      }

      // The identifier zarr-layer declares for one selected band. An index selector is
      // namespaced by its dimension, so band 0 of `band` becomes `band_0`, and the shader has
      // to match that exactly or it fails to compile with "undeclared identifier". Documented
      // upstream from 0.9.1 (carbonplan/zarr-layer#87) rather than read off the implementation.
      // Only indices arrive here — `layerSelector` sends the band axis nothing else.
      function bandIdentifier(dimension, index) {
        return glslName(`${dimension}_${index}`);
      }

      function rgbFrag(names, rescale) {
        const stretch = (name, pair) =>
          `clamp((${name} - ${Number(pair[0]).toFixed(6)}) / (${(Number(pair[1]) - Number(pair[0])).toFixed(6)}), 0.0, 1.0)`;
        return `
          if (${names.map((n) => `isnan(${n})`).join(" || ")}) {
            discard;
          }
          vec3 rgb = vec3(
            ${names.map((n, i) => stretch(n, rescale[i])).join(",\n            ")}
          );
          fragColor = vec4(rgb * opacity, opacity);
        `;
      }

      // The selector as the layer must always see it. A composite pins its band axis to the
      // list of band names, and that has to be re-sent on every update, not just at
      // construction: zarr-layer recomputes its band names from the selector inside
      // `setSelector`, and an array-valued entry is what makes it emit one sampler per band.
      // Send a selector without it and the bands collapse to a single one named after the
      // variable, while `customFrag` stays in place — so the shader still refers to red, green
      // and blue and fails to compile with "undeclared identifier". Both call sites go through
      // here so they cannot drift apart again.
      // Indices are clamped to the control's own step count. The store is the authority on
      // how many slices exist, and it tells us through `values`; this only stops an index
      // from escaping the range the controls were built for. It is not a substitute for the
      // collection publishing `values` on a sparse axis (CLIM-950) — without that the count
      // itself is wrong, and clamping to a wrong count still misses.
      // Every entry is a selection object rather than a raw index: `selector` holds what
      // `indexSelection` produced (CLIM-1003), so the clamp reads `.selected` and re-wraps.
      // Clamping the object itself yields NaN, and a NaN selector reaches the layer silently.
      function layerSelector() {
        const pinned = {};
        for (const d of dimStates) {
          const index = selector[d.key]?.selected ?? 0;
          pinned[d.key] = indexSelection(Math.min(Math.max(0, index), Math.max(0, d.count - 1)));
        }
        return rgb ? { ...pinned, [rgb.dimension]: { selected: rgb.indices, type: "index" } } : pinned;
      }

      // Every non-spatial dimension, in cube order, that the user steps through.
      // Each gets its own control; the layer selector must pin all of them so the
      // cube reduces to 2-D for rendering. Skip the synthetic openEO `bands`
      // dimension (type "bands"): it lists the collection's variables rather than a
      // real axis of the rendered variable, which is selected separately.
      function getSteppingDims(dimensions) {
        return Object.entries(dimensions ?? {})
          .filter(([, v]) => v.type !== "spatial" && v.type !== "bands" && (Array.isArray(v.values) || v.extent))
          .map(([key]) => key);
      }

      // Slider for a continuous / evenly-spaced axis (temporal, or an ordinal axis
      // with a regular numeric `step` such as day-of-year); dropdown for a categorical
      // or irregular one (sex, the irregular age bands). An explicit
      // `open_climate_service:control` on the dimension overrides the heuristic.
      function controlForDim(dim) {
        const hint = dim["open_climate_service:control"];
        if (hint === "slider" || hint === "dropdown") return hint;
        if (dim.type === "temporal" || typeof dim.step === "number") return "slider";
        return "dropdown";
      }

      function dimLabel(key, dim) {
        if (dim.type === "temporal") return "Time step";
        if (key === "dayofyear") return "Day of year";
        return key.charAt(0).toUpperCase() + key.slice(1).replace(/_/g, " ");
      }

      // Human label for one step. Integer age bands render as ranges (0, 1–4, …, 90+).
      function stepDisplay(key, steps, i) {
        const v = stepLabelAt(steps, i);
        if (key === "age_group" && Array.isArray(steps)) {
          const next = steps[i + 1];
          if (next === undefined) return `${v}+`;
          return next - v === 1 ? `${v}` : `${v}–${next - 1}`;
        }
        return String(v);
      }

      // Build the step list for a dimension: explicit `values` (temporal or ordinal),
      // else a temporal extent + ISO duration step.
      function buildSteps(dimensions, dimKey) {
        const dim = (dimensions ?? {})[dimKey];
        if (!dim) return [];
        if (Array.isArray(dim.values)) return dim.values;
        const [start, end] = dim.extent ?? [];
        const step = dim.step;
        if (!start) return [];
        if (!step || !end) return [start];
        return generateDateRange(start, end, step);
      }

      function generateDateRange(start, end, step) {
        const m = step.match(/^P(?:T(\d+)H|(\d+)D|(\d+)M|(\d+)Y)$/);
        if (!m) return [start];
        const sd = new Date(start);
        const ed = new Date(end);
        if (isNaN(sd.getTime()) || isNaN(ed.getTime())) return [start];
        // Months and years must step by the calendar, not a fixed 30-/365-day
        // approximation: the approximation drifts over multi-year ranges and
        // overcounts steps, leaving the slider with more positions than the store
        // has time slices (so the last position reads out of bounds and renders blank).
        if (m[3]) {
          const n = parseInt(m[3]);
          const months =
            (ed.getUTCFullYear() - sd.getUTCFullYear()) * 12 +
            (ed.getUTCMonth() - sd.getUTCMonth());
          return { lazy: true, start, calUnit: "M", n, count: Math.max(1, Math.floor(months / n) + 1) };
        }
        if (m[4]) {
          const n = parseInt(m[4]);
          const years = ed.getUTCFullYear() - sd.getUTCFullYear();
          return { lazy: true, start, calUnit: "Y", n, count: Math.max(1, Math.floor(years / n) + 1) };
        }
        const inc = m[1] ? parseInt(m[1]) * 3_600_000 : parseInt(m[2]) * 86_400_000;
        const count = Math.max(1, Math.floor((ed.getTime() - sd.getTime()) / inc) + 1);
        return { lazy: true, start, inc, count };
      }

      // Select a step by *index*, explicitly. ZarrLayer resolves a bare value against the
      // dimension's coordinate array first, and a CF time axis holds raw offsets (hours since
      // epoch) that never match a slider position — so it logged a resolution failure on every
      // layer load, then fell through to treating a numeric value as the index. That fallback
      // happened to be what we meant, so this worked by accident (CLIM-1003).
      //
      // Saying it outright drops the wasted coordinate read and the logged failure, and no
      // longer depends on a fallback that has since been removed: carbonplan/zarr-layer#87,
      // released in 0.9.1, rejects an unresolvable *string* selector instead of silently
      // returning index 0, and keeps the direct-index behaviour this relies on. Every write to
      // `selector` goes through here so they cannot drift apart.
      function indexSelection(index) {
        return { selected: index, type: "index" };
      }

      function stepCount(steps) {
        return Array.isArray(steps) ? steps.length : steps.count;
      }

      function stepLabelAt(steps, i) {
        if (Array.isArray(steps)) {
          const v = steps[i];
          // Explicit `values` cover two kinds of axis: ordinal ones list numbers
          // (day-of-year) or category names (sex), which pass through untouched, while an
          // irregular temporal axis lists ISO timestamps. Those want the same granularity
          // trimming the generated branches below apply, so a dekadal axis reads
          // "2024-12-21" rather than "2024-12-21T00:00:00Z" on every step.
          if (typeof v === "string") {
            const midnight = v.match(/^(\d{4}-\d{2}-\d{2})T00:00(?::00(?:\.0+)?)?Z?$/);
            if (midnight) return midnight[1];
            if (/^\d{4}-\d{2}-\d{2}T/.test(v)) return v.slice(0, 16).replace("T", " ");
          }
          return v;
        }
        const sd = new Date(steps.start);
        // Label at the granularity of the step: year for P1Y, year-month for P1M,
        // date for daily, date+time for sub-daily — so a yearly axis shows "2026",
        // not "2026-01-01".
        if (steps.calUnit === "M") {
          const d = new Date(sd);
          d.setUTCMonth(d.getUTCMonth() + i * steps.n);
          return d.toISOString().slice(0, 7);
        }
        if (steps.calUnit === "Y") {
          const d = new Date(sd);
          d.setUTCFullYear(d.getUTCFullYear() + i * steps.n);
          return d.toISOString().slice(0, 4);
        }
        const iso = new Date(sd.getTime() + i * steps.inc).toISOString();
        return steps.inc < 86_400_000 ? iso.slice(0, 16).replace("T", " ") : iso.slice(0, 10);
      }

      const MAP_UNAVAILABLE_MESSAGE =
        "Map rendering is unavailable in this browser session because WebGL could not be initialized. Dataset discovery still works.";

      let map = null;
      let mapUnavailable = false;
      let activeLayer = null;
      // One entry per non-spatial dimension: { key, dim, steps, control, count, label, index }.
      let dimStates = [];
      // Current index per dimension key — pins every non-spatial axis for the layer.
      let selector = {};
      // { bands, rescale, dimension } for a true-colour collection, else null.
      let rgb = null;
      // Set once a dataset has positioned the view, so the instance-extent fit cannot undo it.
      // `fitToExtent` awaits a fetch, so without this it can resolve *after* the first
      // dataset has loaded and yank the view back out to the whole country.
      let viewPinnedByLayer = false;

      // A layer spanning less than this fraction of the viewport is treated as out of view.
      // The 1.3 km Vantor footprint is 0.2% of Nepal's width: technically on screen at the
      // instance extent, and impossible to find.
      const MIN_VISIBLE_SPAN = 0.1;

      const selectEl = document.getElementById("dataset-select");
      const dimControls = document.getElementById("dim-controls");
      const datasetMeta = document.getElementById("dataset-meta");
      const metaSource = document.getElementById("meta-source");
      const metaUnits = document.getElementById("meta-units");
      const metaUnitsLabel = document.getElementById("meta-units-label");
      const metaDescription = document.getElementById("meta-description");
      const metaLicence = document.getElementById("meta-licence");
      const legendEl = document.getElementById("legend");
      const legendBar = document.getElementById("legend-bar");
      const legendMin = document.getElementById("legend-min");
      const legendMax = document.getElementById("legend-max");
      const legendUnits = document.getElementById("legend-units");
      const statusEl = document.getElementById("status");

      function updateLegend(cm, clim, units) {
        if (rgb) {
          // A true-colour composite has no single ramp to explain, and showing one from
          // the unused colormap would be actively misleading.
          legendEl.classList.add("hidden");
          return;
        }
        const stops = Array.from(
          { length: 32 },
          (_, i) => cm[Math.round((i * (cm.length - 1)) / 31)]
        );
        legendBar.style.background = `linear-gradient(to right, ${stops.join(", ")})`;
        legendMin.textContent = clim[0];
        legendMax.textContent = clim[1];
        legendUnits.textContent = units ? `(${units})` : "";
        legendEl.classList.remove("hidden");
      }

      function setStatus(msg, isError = false) {
        statusEl.textContent = msg;
        statusEl.className = isError ? "status error" : "status";
      }

      function initMap() {
        try {
          map = new maplibregl.Map({
            container: "map",
            style: "https://tiles.openfreemap.org/styles/positron",
            center: [20, 20],
            zoom: 1.5,
            projection: { type: "globe" },
            fitBoundsOptions: { padding: 40 },
            attributionControl: { compact: true },
          });
        } catch (err) {
          mapUnavailable = true;
          setStatus(MAP_UNAVAILABLE_MESSAGE, true);
          return;
        }

        map.on("load", () => {
          map.setProjection({ type: "globe" });
          fitToExtent();
        });

        map.on("error", (event) => {
          const message = event?.error?.message ?? "";
          if (message.toLowerCase().includes("webgl")) {
            mapUnavailable = true;
            setStatus(MAP_UNAVAILABLE_MESSAGE, true);
          }
        });
      }

      async function fitToExtent() {
        if (!map || mapUnavailable || viewPinnedByLayer) return;
        try {
          const res = await fetch("{{ mount }}/extent");
          if (!res.ok) return;
          const extent = await res.json();
          const [xmin, ymin, xmax, ymax] = extent.bbox;
          map.fitBounds([[xmin, ymin], [xmax, ymax]], { padding: 40, maxZoom: 10 });
        } catch {}
      }


      // Bring a newly selected layer into view when it would otherwise be unfindable.
      //
      // Deliberately conditional. Re-fitting on every dataset switch would discard a view the
      // user had chosen — comparing two layers over the same spot means switching between them
      // without the map moving — so this only acts when the layer is genuinely not viewable:
      // outside the viewport entirely, or so small within it as to be a speck.
      //
      // Zooming *out* is not handled: a layer larger than the viewport is still visible, and a
      // user zoomed into a global dataset is looking at exactly what they asked for.
      function revealLayer(collection) {
        if (!map || mapUnavailable) return;
        const bbox = collection.extent?.spatial?.bbox?.[0];
        if (!Array.isArray(bbox) || bbox.length < 4) return;
        const [w, s, e, n] = bbox.slice(0, 4).map(Number);
        if (![w, s, e, n].every(Number.isFinite) || w >= e || s >= n) return;

        const view = map.getBounds();
        const viewWidth = view.getEast() - view.getWest();
        const viewHeight = view.getNorth() - view.getSouth();
        // Before the map has a size, getBounds is not meaningful; fit rather than divide by it.
        const measurable = Number.isFinite(viewWidth) && Number.isFinite(viewHeight) && viewWidth > 0 && viewHeight > 0;

        if (measurable) {
          const offscreen =
            e < view.getWest() || w > view.getEast() || n < view.getSouth() || s > view.getNorth();
          const spanRatio = Math.max((e - w) / viewWidth, (n - s) / viewHeight);
          if (!offscreen && spanRatio >= MIN_VISIBLE_SPAN) {
            viewPinnedByLayer = true;
            return;
          }
        }
        // maxZoom so a sub-kilometre footprint stops at a usable scale instead of going to
        // street level, where the imagery is past its own resolution.
        map.fitBounds([[w, s], [e, n]], { padding: 40, maxZoom: 16 });
        viewPinnedByLayer = true;
      }

      async function loadCatalog() {
        try {
          const res = await fetch("{{ mount }}/collections");
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const body = await res.json();
          const collections = body.collections ?? [];
          if (collections.length === 0) {
            setStatus(
              "No published datasets found. Ingest and publish a dataset first."
            );
            return;
          }
          for (const col of collections) {
            const href = `{{ mount }}/collections/${col.id}`;
            const opt = document.createElement("option");
            opt.value = href;
            opt.textContent = col.title ?? col.id;
            selectEl.appendChild(opt);
          }
          setStatus(
            mapUnavailable
              ? MAP_UNAVAILABLE_MESSAGE
              : "Select a dataset to visualise it on the map.",
            mapUnavailable
          );
        } catch (err) {
          setStatus(`Failed to load catalog: ${err.message}`, true);
        }
      }

      async function loadDataset(href) {
        if (!map || mapUnavailable) {
          setStatus(MAP_UNAVAILABLE_MESSAGE, true);
          return;
        }
        setStatus("Loading...");
        clearTimeout(_selectorDebounce);
        if (activeLayer) {
          try {
            map.removeLayer("zarr-layer");
          } catch {}
          activeLayer = null;
        }
        dimControls.classList.add("hidden");
        dimControls.replaceChildren();
        datasetMeta.classList.add("hidden");
        legendEl.classList.add("hidden");

        let collection;
        try {
          const res = await fetch(href);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          collection = await res.json();
        } catch (err) {
          setStatus(`Failed to load collection: ${err.message}`, true);
          return;
        }

        const renders = collection.renders?.default ?? {};
        const zarr = collection.assets?.zarr;
        if (!zarr?.href) {
          setStatus("No Zarr asset found in this collection.");
          return;
        }

        const clim = renders.rescale?.[0] ?? [0, 100];
        const colormapName = renders.colormap_name ?? "viridis";
        const fillValue = renders.nodata ?? null;
        const variable =
          renders["open_climate_service:variable"] ??
          Object.keys(collection["cube:variables"] ?? {})[0] ??
          "data";

        // Build a control state for every non-spatial dimension. The layer selector
        // must pin each one so the cube reduces to 2-D for rendering.
        const dimensions = collection["cube:dimensions"] ?? {};
        // A true-colour render pins the band axis itself, so it must not also get a
        // stepping control — the selector would then disagree with the shader.
        rgb = readRgbRender(renders, dimensions);
        // A collection that declares `bands` and cannot be resolved into one must not quietly
        // fall through to the colormapped path: that renders a single band under a ramp, which
        // looks like a working layer and is a picture of different data. `readRgbRender` has
        // already explained why on the status line, so stop here rather than clearing it below.
        if (rgb === null && Array.isArray(renders?.bands)) {
          return;
        }
        dimStates = getSteppingDims(dimensions)
          .filter((key) => key !== rgb?.dimension)
          .map((key) => {
          const dim = dimensions[key];
          const steps = buildSteps(dimensions, key);
          const control = controlForDim(dim);
          const count = stepCount(steps);
          // A slider defaults to its last step (e.g. latest time); a dropdown to its first.
          const index = control === "slider" ? Math.max(0, count - 1) : 0;
          return { key, dim, steps, control, count, label: dimLabel(key, dim), index };
        });
        selector = {};
        for (const d of dimStates) selector[d.key] = indexSelection(d.index);

        // The CRS code alone is enough here. From 0.8.0 ZarrLayer resolves a code through
        // proj4's own registry, which carries every UTM zone among others, so a projected
        // store no longer needs a proj4 definition handed to it. That retires both the
        // `open_climate_service:proj4` hint we used to publish and the epsg.io fetch that
        // backed it up (CLIM-833) — one fewer non-standard field, and no third-party
        // request on the render path.
        //
        // proj4's registry does not cover *every* EPSG code — carbonplan/zarr-layer#61,
        // which would bundle a full database, is still open — so a code alone would leave a
        // national grid (EPSG:27700, EPSG:2154) unresolved. Passing one here is harmless
        // rather than fatal: ZarrLayer keeps no override for a code it cannot resolve, and
        // falls back to reading the store's own `proj:wkt2` / `proj:projjson`, which both
        // write paths publish beside `proj:code` (shared/crs.py, store_crs_attrs). The
        // store, not the reader's lookup table, is what has to know the CRS.
        let nativeCrs = collection["proj:code"] ?? "EPSG:4326";
        // CRS84 aliases (CRS84, OGC:CRS84, CRS:84, or a CRS84 URI) are geographic WGS84,
        // normalised so `crs` is a code ZarrLayer recognises directly. Separators are
        // stripped first so the short OGC form CRS:84 is matched too.
        if (nativeCrs.toUpperCase().replace(/[^A-Z0-9]/g, "").endsWith("CRS84")) nativeCrs = "EPSG:4326";

        // No `bounds` is passed, deliberately: the store carries its own placement in the
        // GeoZarr `spatial:*` attributes, and from 0.8.0 ZarrLayer reads them. Handing it a
        // catalogue-derived extent as well would only add a second source of truth.
        //
        // It is also not safe to pass blind. ZarrLayer documents `bounds` as *edge* bounds,
        // while `proj:bbox` is edge-based only when the store declares `spatial:bbox` for
        // the STAC builder to prefer; without that it falls back to the coordinate min/max,
        // which spans cell *centres*. Passing one as the other is half a cell out —
        // invisible at country zoom, wrong as you zoom in. The store knows which it holds
        // and the viewer does not, so let the library read the store.

        let cm;
        try {
          cm = buildColormap(colormapName);
          const zarrVersion = zarr["zarr:zarr_format"] ?? null;
          activeLayer = new ZarrLayer({
            id: "zarr-layer",
            source: zarr.href,
            variable,
            clim,
            colormap: cm,
            opacity: 1,
            selector: layerSelector(),
            ...(rgb !== null && {
              customFrag: rgbFrag(
                rgb.indices.map((i) => bandIdentifier(rgb.dimension, i)),
                rgb.rescale,
              ),
            }),
            ...(zarrVersion !== null && { zarrVersion }),
            ...(fillValue !== null && { fillValue }),
            crs: nativeCrs,
          });
          map.addLayer(activeLayer);
          for (const layer of map.getStyle().layers) {
            if ((layer.type === "line" && layer.id.startsWith("boundary")) || layer.type === "symbol") {
              map.moveLayer(layer.id);
            }
          }
        } catch (err) {
          setStatus(`Failed to create layer: ${err.message}`, true);
          return;
        }


        // One control per non-spatial dimension (slider or dropdown).
        renderDimControls();

        // Metadata strip.
        const source = collection.keywords?.find(
          (k) =>
            k !== "zarr" &&
            k !== "stac" &&
            k !== variable &&
            k !== collection.id
        );
        const units = collection["cube:variables"]?.[variable]?.unit ?? "";
        metaSource.textContent = source ?? "—";
        // A composite is a picture, not a measurement, so its unit is an artefact of having to
        // put something in the field: the imagery layers declare `1`, which tells a reader
        // nothing and invites them to treat display values as calibrated. Hide the row for
        // those, and for a dataset that declares no unit at all — an em dash is not
        // information either. The same reasoning already hides the legend for a composite.
        // The `.hidden` class rather than the `hidden` attribute: it carries `!important`, so
        // it cannot be defeated by an author `display` rule on a grid item.
        const showUnits = !rgb && Boolean(units);
        metaUnits.textContent = units;
        metaUnitsLabel.classList.toggle("hidden", !showUnits);
        metaUnits.classList.toggle("hidden", !showUnits);
        datasetMeta.classList.remove("hidden");

        // The collection description, which is where a dataset states what its values actually
        // mean (CLIM-973). Shown here because this is where someone picks a layer: RWI is
        // relative within one country, MODIS LST is surface and not air temperature. Skipped
        // when it is the generated fallback, which tells a reader nothing the dataset name
        // does not already.
        // Compared exactly, not by prefix: the collection title is the same string the
        // fallback is built from, so a real description that happens to open with those words
        // ("Published GeoZarr dataset for X - use only within one country") is kept rather
        // than mistaken for the generated one.
        // A user who can see a layer should be able to see what they may do with it
        // (CLIM-946). `other` is what an undeclared licence publishes, so say "not declared"
        // rather than showing a word that reads like the name of a licence.
        const licenceLink = (collection.links ?? []).find((l) => l.rel === "license");
        const licence = collection.license;
        const licenceLabel =
          !licence || licence === "other" ? (licenceLink?.title ?? "not declared") : licence;
        if (licenceLink?.href) {
          const anchor = document.createElement("a");
          anchor.href = licenceLink.href;
          anchor.target = "_blank";
          anchor.rel = "noopener noreferrer";
          anchor.textContent = licenceLabel;
          metaLicence.replaceChildren(anchor);
        } else {
          metaLicence.textContent = licenceLabel;
        }

        const description = collection.description ?? "";
        const generated = description === `Published GeoZarr dataset for ${collection.title}`;
        metaDescription.textContent = description;
        metaDescription.classList.toggle("hidden", !description || generated);

        updateLegend(cm, clim, units);
        revealLayer(collection);

        setStatus("");
      }

      selectEl.addEventListener("change", (e) => {
        if (e.target.value) loadDataset(e.target.value);
      });

      let _selectorDebounce = null;
      function applySelector() {
        const layer = activeLayer;
        clearTimeout(_selectorDebounce);
        _selectorDebounce = setTimeout(() => {
          layer?.setSelector(layerSelector());
        }, 150);
      }

      // Render one control per non-spatial dimension with more than one step.
      // Sliders for temporal/regular-ordinal axes, dropdowns for categorical/irregular
      // ones; each writes its index into the shared `selector` and re-renders the layer.
      function renderDimControls() {
        dimControls.replaceChildren();
        const stepping = dimStates.filter((d) => d.count > 1);
        if (!stepping.length) {
          dimControls.classList.add("hidden");
          return;
        }
        for (const d of stepping) {
          const block = document.createElement("div");
          block.style.marginBottom = "0.8rem";

          const header = document.createElement("div");
          header.className = "time-header";
          const label = document.createElement("label");
          label.style.marginBottom = "0";
          label.textContent = d.label;
          const count = document.createElement("span");
          count.className = "time-count";
          header.append(label, count);
          block.append(header);

          if (d.control === "slider") {
            const valueWrap = document.createElement("div");
            valueWrap.style.marginBottom = "0.4rem";
            const valueEl = document.createElement("span");
            valueEl.className = "time-value";
            valueEl.textContent = stepDisplay(d.key, d.steps, d.index);
            valueWrap.append(valueEl);
            count.textContent = `${d.index + 1} / ${d.count}`;

            const slider = document.createElement("input");
            slider.type = "range";
            slider.min = "0";
            slider.step = "1";
            slider.max = String(d.count - 1);
            slider.value = String(d.index);
            slider.addEventListener("input", (e) => {
              const i = parseInt(e.target.value, 10);
              d.index = i;
              selector[d.key] = indexSelection(i);
              valueEl.textContent = stepDisplay(d.key, d.steps, i) ?? "—";
              count.textContent = `${i + 1} / ${d.count}`;
              applySelector();
            });
            block.append(valueWrap, slider);
          } else {
            const select = document.createElement("select");
            for (let i = 0; i < d.count; i++) {
              const opt = document.createElement("option");
              opt.value = String(i);
              opt.textContent = stepDisplay(d.key, d.steps, i);
              if (i === d.index) opt.selected = true;
              select.append(opt);
            }
            select.addEventListener("change", (e) => {
              const i = parseInt(e.target.value, 10);
              d.index = i;
              selector[d.key] = indexSelection(i);
              applySelector();
            });
            block.append(select);
          }
          dimControls.append(block);
        }
        dimControls.classList.remove("hidden");
      }

      initMap();
      loadCatalog();
    </script>
  </body>
</html>
