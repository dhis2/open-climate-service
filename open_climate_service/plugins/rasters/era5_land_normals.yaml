- id: era5land_temperature_daily_normal_1991_2020
  name: 2m temperature daily normal (ERA5-Land, 1991–2020)
  short_name: Temperature daily normal
  description: >-
    Average ERA5-Land temperature for each day of the year over 1991-2020, smoothed over a 31-day
    window. The baseline an anomaly is measured against.
  variable: t2m
  period_type: climatology
  sync:
    kind: static
  extents:
    spatial:
      bbox: [-180, -90, 180, 90]
  ingestion:
    plugin: open_climate_service.plugins.rasters.era5_land_normals.ERA5LandNormalsPlugin
    params:
      edh_variable: t2m
      variable: t2m
      period: [1991, 2020]
      smoothing_window: 31
      unit_transform: kelvin_to_celsius
  units: degC
  resolution: 9 km x 9 km
  source: ERA5-Land Reanalysis (Earth Data Hub)
  source_url: https://earthdatahub.destine.eu/collections/era5/datasets/era5-land-daily
  license:
    name: Licence to Use Copernicus Products
    url: https://apps.ecmwf.int/datasets/licences/copernicus/
  providers:
    - name: Copernicus Climate Change Service (C3S)
      url: https://climate.copernicus.eu/
  display:
    colormap: rdbu_r
    range: [-30.0, 30.0]

- id: era5land_precipitation_daily_normal_1991_2020
  name: Total precipitation daily normal (ERA5-Land, 1991–2020)
  short_name: Precipitation daily normal
  description: >-
    Average ERA5-Land rainfall for each day of the year over 1991-2020, smoothed over a 31-day
    window. The baseline an anomaly is measured against.
  variable: tp
  period_type: climatology
  sync:
    kind: static
  extents:
    spatial:
      bbox: [-180, -90, 180, 90]
  ingestion:
    plugin: open_climate_service.plugins.rasters.era5_land_normals.ERA5LandNormalsPlugin
    params:
      edh_variable: tp
      variable: tp
      period: [1991, 2020]
      smoothing_window: 31
      unit_transform: metres_to_mm
  units: mm
  resolution: 9 km x 9 km
  source: ERA5-Land Reanalysis (Earth Data Hub)
  source_url: https://earthdatahub.destine.eu/collections/era5/datasets/era5-land-daily
  license:
    name: Licence to Use Copernicus Products
    url: https://apps.ecmwf.int/datasets/licences/copernicus/
  providers:
    - name: Copernicus Climate Change Service (C3S)
      url: https://climate.copernicus.eu/
  display:
    colormap: blues
    range: [0.0, 20.0]

# ---------------------------------------------------------------------------
# Monthly climate-normal output templates for the `climate_normal` openEO workflow
# (month-of-year means computed from an already-ingested managed GeoZarr store). These
# have NO ingestion plugin — the data is produced by the workflow and published via
# save_result, which requires a registered static template for the output id. Run the
# workflow on an ERA5-Land dataset with `frequency: month`. The reference period is
# baked into the id (e.g. _1991_2020); add a copy with a new period when one is adopted.
# (Day-of-year ERA5-Land normals come from the EDH-direct era5land_*_daily_normal_*
# templates above, so only the monthly variants are produced from the store here.)
# ---------------------------------------------------------------------------

- id: era5land_temperature_monthly_normal_1991_2020
  name: 2m temperature monthly normal (ERA5-Land, 1991–2020)
  short_name: Temperature monthly normal
  description: >-
    Average ERA5-Land temperature for each calendar month over 1991-2020. The baseline a monthly
    anomaly is measured against.
  variable: t2m
  period_type: climatology
  sync:
    kind: static
  units: degC
  source: Derived (climate_normal workflow)
  produced_by: climate_normal
  license:
    name: Licence to Use Copernicus Products
    url: https://apps.ecmwf.int/datasets/licences/copernicus/
  providers:
    - name: Copernicus Climate Change Service (C3S)
      url: https://climate.copernicus.eu/
  display:
    colormap: rdbu_r
    range: [-30.0, 30.0]

- id: era5land_precipitation_monthly_normal_1991_2020
  name: Mean daily precipitation monthly normal (ERA5-Land, 1991–2020)
  short_name: Precipitation monthly normal
  description: >-
    Average ERA5-Land rainfall for each calendar month over 1991-2020. The baseline a monthly
    anomaly is measured against.
  variable: tp
  period_type: climatology
  sync:
    kind: static
  # mm/d, not a monthly total: the workflow averages the daily-rate (mm/d) source over
  # the days in each calendar month, so the result stays a mean daily rate.
  units: mm/d
  source: Derived (climate_normal workflow)
  produced_by: climate_normal
  license:
    name: Licence to Use Copernicus Products
    url: https://apps.ecmwf.int/datasets/licences/copernicus/
  providers:
    - name: Copernicus Climate Change Service (C3S)
      url: https://climate.copernicus.eu/
  display:
    colormap: blues
    range: [0.0, 20.0]

# ---------------------------------------------------------------------------
# Anomaly output templates for the `climate_anomaly` openEO workflow
# (observed − climatological normal, aligned by day-of-year). No ingestion plugin —
# produced by the workflow and published via save_result. Run the workflow with the
# observed daily dataset + the matching _normal_1991_2020 dataset; refresh by re-running.
# Anomalies are diverging (above/below normal), so a centred rdbu_r colormap.
# ---------------------------------------------------------------------------

- id: era5land_temperature_daily_anomaly_1991_2020
  name: 2m temperature daily anomaly (ERA5-Land, vs 1991–2020 normal)
  short_name: Temperature anomaly
  description: >-
    A day's ERA5-Land temperature minus its 1991-2020 normal. Negative is colder than usual,
    positive warmer.
  variable: t2m
  period_type: daily
  sync:
    kind: static
  units: degC
  source: Derived (climate_anomaly workflow)
  produced_by: climate_anomaly
  license:
    name: Licence to Use Copernicus Products
    url: https://apps.ecmwf.int/datasets/licences/copernicus/
  providers:
    - name: Copernicus Climate Change Service (C3S)
      url: https://climate.copernicus.eu/
  display:
    colormap: rdbu_r
    range: [-15.0, 15.0]

- id: era5land_precipitation_daily_relative_anomaly_1991_2020
  name: Precipitation daily relative anomaly (ERA5-Land, vs 1991–2020 normal)
  short_name: Precipitation anomaly (%)
  description: >-
    How far a day's ERA5-Land rainfall sits from its 1991-2020 normal, as a percentage of that
    normal. Negative is drier than usual, positive wetter.
  variable: tp
  period_type: daily
  sync:
    kind: static
  units: "%"
  source: Derived (climate_anomaly workflow, method=relative)
  produced_by: climate_anomaly
  license:
    name: Licence to Use Copernicus Products
    url: https://apps.ecmwf.int/datasets/licences/copernicus/
  providers:
    - name: Copernicus Climate Change Service (C3S)
      url: https://climate.copernicus.eu/
  display:
    colormap: RdBu
    range: [-100.0, 100.0]

- id: era5land_precipitation_daily_anomaly_1991_2020
  name: Precipitation daily anomaly (ERA5-Land, vs 1991–2020 normal)
  short_name: Precipitation anomaly
  description: >-
    A day's ERA5-Land rainfall minus its 1991-2020 normal. Negative is drier than usual, positive
    wetter.
  variable: tp
  period_type: daily
  sync:
    kind: static
  units: mm/d
  source: Derived (climate_anomaly workflow)
  produced_by: climate_anomaly
  license:
    name: Licence to Use Copernicus Products
    url: https://apps.ecmwf.int/datasets/licences/copernicus/
  providers:
    - name: Copernicus Climate Change Service (C3S)
      url: https://climate.copernicus.eu/
  display:
    colormap: RdBu
    range: [-20.0, 20.0]

