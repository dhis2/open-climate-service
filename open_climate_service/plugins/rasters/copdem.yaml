- id: copdem30_elevation_static
  name: Elevation (Copernicus 30m DEM, static)
  short_name: Elevation
  variable: elevation
  description: Digital Elevation Model (DEM) representing height in meters above sea level. Note that height is recorded as the highest point at each location, so e.g. will capture the height of tree canopy rather than ground level.
  # No period_type: elevation has no time axis, so the store is (y, x).
  sync:
    kind: static
  extents:
    spatial:
      bbox: [-180, -90, 180, 90]
  ingestion:
    plugin: open_climate_service.plugins.rasters.copdem.CopDEMPlugin
    params:
      product: GLO-30
  standard_name: surface_altitude
  units: m
  resolution: 30 m x 30 m
  source: Copernicus / DestinE
  source_url: https://earthdatahub.destine.eu/collections/copernicus-dem/datasets/GLO-30
  license:
    name: Licence to Use Copernicus DEM
    url: https://documentation.dataspace.copernicus.eu/APIs/SentinelHub/Data/DEM/resources/license/License-COPDEM-30.pdf
  providers:
    - name: Copernicus
      url: https://www.copernicus.eu/
  display:
    colormap: ["#1a7a3c", "#8fbf5a", "#f2e6a0", "#b08a5a", "#7a5a48", "#ffffff"]
    range: [0, 4500]

- id: copdem90_elevation_static
  name: Elevation (Copernicus 90m DEM, static)
  short_name: Elevation
  variable: elevation
  description: Digital Elevation Model (DEM) representing height in meters above sea level. Note that height is recorded as the highest point at each location, so e.g. will capture the height of tree canopy rather than ground level. Coarser than the 30m DEM, so faster to ingest and smaller to store for a large extent.
  sync:
    kind: static
  extents:
    spatial:
      bbox: [-180, -90, 180, 90]
  ingestion:
    plugin: open_climate_service.plugins.rasters.copdem.CopDEMPlugin
    params:
      product: GLO-90
  standard_name: surface_altitude
  units: m
  resolution: 90 m x 90 m
  source: Copernicus / DestinE
  source_url: https://earthdatahub.destine.eu/collections/copernicus-dem/datasets/GLO-90
  license:
    name: Licence to Use Copernicus DEM
    url: https://documentation.dataspace.copernicus.eu/APIs/SentinelHub/Data/DEM/resources/license/License-COPDEM-30.pdf
  providers:
    - name: Copernicus
      url: https://www.copernicus.eu/
  display:
    colormap: ["#1a7a3c", "#8fbf5a", "#f2e6a0", "#b08a5a", "#7a5a48", "#ffffff"]
    range: [0, 4500]
