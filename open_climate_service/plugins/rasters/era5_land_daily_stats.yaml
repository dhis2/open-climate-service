- id: era5land_temperature_min_daily
  name: Minimum 2m temperature (ERA5-Land)
  short_name: Minimum temperature
  description: Daily minimum air temperature 2 m above the ground at 9 km, worldwide, from 1950 to a few
    days ago. Days run in the instance's own time zone.
  standard_name: air_temperature
  variable: t2m
  period_type: daily
  sync:
    kind: temporal
    execution: append
  extents:
    spatial:
      bbox:
      - -180
      - -90
      - 180
      - 90
    temporal:
      begin: '1950-01-01'
      resolution: P1D
  ingestion:
    plugin: open_climate_service.plugins.rasters.era5_land_daily_stats.ERA5LandCDSDailyStatisticPlugin
    params:
      variable: t2m
      statistic: min
  units: degC
  cell_methods: 'time: minimum'
  resolution: 9 km x 9 km
  source: ERA5-Land Reanalysis
  source_url: https://cds.climate.copernicus.eu/datasets/derived-era5-land-daily-statistics
  license:
    name: Licence to Use Copernicus Products
    url: https://apps.ecmwf.int/datasets/licences/copernicus/
  providers:
  - name: Copernicus Climate Change Service (C3S)
    url: https://climate.copernicus.eu/
  display:
    colormap: rdbu_r
    range:
    - -30.0
    - 30.0

