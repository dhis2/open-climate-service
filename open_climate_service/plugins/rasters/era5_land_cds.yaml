- id: era5land_temperature_daily
  name: 2m temperature (ERA5-Land)
  short_name: 2m temperature
  description: >-
    Daily mean air temperature 2 m above the ground at 9 km worldwide, aggregated from the hourly
    CDS geo-chunked ARCO archive. Days run in UTC.
  standard_name: air_temperature
  variable: t2m
  period_type: daily
  sync:
    kind: temporal
    execution: append
  extents:
    spatial:
      bbox: [-180, -90, 180, 90]
    temporal:
      begin: "1950-01-02"
      resolution: P1D
  ingestion:
    plugin: open_climate_service.plugins.rasters.era5_land_cds.ERA5LandCDSZarrDailyFromHourlyPlugin
    params:
      variable: t2m
      temporal_aggregation: mean
      unit_transform: kelvin_to_celsius
  units: degC
  cell_methods: "time: mean"
  resolution: 9 km x 9 km
  source: ERA5-Land Reanalysis
  source_url: https://cds.climate.copernicus.eu/datasets/reanalysis-era5-land?tab=analysis_ready_data
  license:
    name: Licence to Use Copernicus Products
    url: https://apps.ecmwf.int/datasets/licences/copernicus/
  providers:
    - name: Copernicus Climate Change Service (C3S)
      url: https://climate.copernicus.eu/
  display:
    colormap: rdbu_r
    range: [-30.0, 30.0]

