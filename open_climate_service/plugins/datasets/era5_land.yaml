# ---------------------------------------------------------------------------
# Monthly climate-normal output templates for the `climate_normal` openEO workflow
# (month-of-year means computed from an already-ingested managed GeoZarr store). These
# have NO ingestion plugin — the data is produced by the workflow and published via
# save_result, which requires a registered static template for the output id. Run the
# workflow on an ERA5-Land dataset with `frequency: month`. The reference period is
# baked into the id (e.g. _1991_2020); add a copy with a new period when one is adopted.
# (Day-of-year ERA5-Land normals come from the EDH-direct era5land_*_daily_normal_*
# templates above, so only the monthly variants are produced from the store here.)
# ---------------------------------------------------------------------------

- id: era5land_temperature_monthly_normal_1991_2020
  name: 2m temperature monthly normal (ERA5-Land, 1991–2020)
  short_name: Temperature monthly normal
  variable: t2m
  period_type: climatology
  sync:
    kind: static
  units: degC
  source: Derived (climate_normal workflow)
  license:
    name: Licence to Use Copernicus Products
    url: https://apps.ecmwf.int/datasets/licences/copernicus/
  providers:
    - name: Copernicus Climate Change Service (C3S)
      url: https://climate.copernicus.eu/
  display:
    colormap: rdbu_r
    range: [-30.0, 30.0]

- id: era5land_precipitation_monthly_normal_1991_2020
  name: Mean daily precipitation monthly normal (ERA5-Land, 1991–2020)
  short_name: Precipitation monthly normal
  variable: tp
  period_type: climatology
  sync:
    kind: static
  # mm/d, not a monthly total: the workflow averages the daily-rate (mm/d) source over
  # the days in each calendar month, so the result stays a mean daily rate.
  units: mm/d
  source: Derived (climate_normal workflow)
  license:
    name: Licence to Use Copernicus Products
    url: https://apps.ecmwf.int/datasets/licences/copernicus/
  providers:
    - name: Copernicus Climate Change Service (C3S)
      url: https://climate.copernicus.eu/
  display:
    colormap: blues
    range: [0.0, 20.0]

# ---------------------------------------------------------------------------
# Anomaly output templates for the `climate_anomaly` openEO workflow
# (observed − climatological normal, aligned by day-of-year). No ingestion plugin —
# produced by the workflow and published via save_result. Run the workflow with the
# observed daily dataset + the matching _normal_1991_2020 dataset; refresh by re-running.
# Anomalies are diverging (above/below normal), so a centred rdbu_r colormap.
# ---------------------------------------------------------------------------

- id: era5land_temperature_daily_anomaly_1991_2020
  name: 2m temperature daily anomaly (ERA5-Land, vs 1991–2020 normal)
  short_name: Temperature anomaly
  variable: t2m
  period_type: daily
  sync:
    kind: static
  units: degC
  source: Derived (climate_anomaly workflow)
  license:
    name: Licence to Use Copernicus Products
    url: https://apps.ecmwf.int/datasets/licences/copernicus/
  providers:
    - name: Copernicus Climate Change Service (C3S)
      url: https://climate.copernicus.eu/
  display:
    colormap: rdbu_r
    range: [-15.0, 15.0]

- id: era5land_precipitation_daily_relative_anomaly_1991_2020
  name: Precipitation daily relative anomaly (ERA5-Land, vs 1991–2020 normal)
  short_name: Precipitation anomaly (%)
  variable: tp
  period_type: daily
  sync:
    kind: static
  units: "%"
  source: Derived (climate_anomaly workflow, method=relative)
  license:
    name: Licence to Use Copernicus Products
    url: https://apps.ecmwf.int/datasets/licences/copernicus/
  providers:
    - name: Copernicus Climate Change Service (C3S)
      url: https://climate.copernicus.eu/
  display:
    colormap: RdBu
    range: [-100.0, 100.0]

- id: era5land_precipitation_daily_anomaly_1991_2020
  name: Precipitation daily anomaly (ERA5-Land, vs 1991–2020 normal)
  short_name: Precipitation anomaly
  variable: tp
  period_type: daily
  sync:
    kind: static
  units: mm/d
  source: Derived (climate_anomaly workflow)
  license:
    name: Licence to Use Copernicus Products
    url: https://apps.ecmwf.int/datasets/licences/copernicus/
  providers:
    - name: Copernicus Climate Change Service (C3S)
      url: https://climate.copernicus.eu/
  display:
    colormap: RdBu
    range: [-20.0, 20.0]

