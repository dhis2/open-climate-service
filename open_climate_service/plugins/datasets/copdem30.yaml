- id: copdem30_elevation_static
  name: Elevation (Copernicus 30m DEM, static)
  short_name: Elevation
  variable: elevation
  description: Digital Elevation Model (DEM) representing height in meters above sea level. Note that height is recorded as the highest point at each location, so e.g. will capture the height of tree canopy rather than ground level. 
  period_type: yearly
  sync:
    kind: release
    version:
      value: v0
      authority: destine
  extents:
    spatial:
      bbox: [-180, -90, 180, 90]
    temporal:
      begin: "2010"
      end: "2010"
      resolution: P1Y
  ingestion:
    plugin: open_climate_service.plugins.datasets.copdem30.CopDEM30Plugin
  standard_name: surface_altitude
  units: m
  resolution: 30 m x 30 m
  source: Copernicus / DestinE
  source_url: https://earthdatahub.destine.eu/collections/copernicus-dem/datasets/GLO-30
  license:
    name: Licence to Use Copernicus DEM
    url: https://documentation.dataspace.copernicus.eu/APIs/SentinelHub/Data/DEM/resources/license/License-COPDEM-30.pdf
  providers:
    - name: Copernicus
      url: https://www.copernicus.eu/
  display:
    colormap: viridis
    range: [0, 4500]
