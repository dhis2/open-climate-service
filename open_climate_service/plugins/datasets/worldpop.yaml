- id: worldpop_population_global2_100m
  name: Total population (WorldPop Global2, 100m)
  short_name: Total population
  description: >-
    Modelled number of people living in each 100 m grid cell, worldwide. Yearly estimates and
    projections for 2015-2030 from the WorldPop Global2 R2025A release.
  variable: pop_total
  period_type: yearly
  # Runs 2015-2030, so periods straddle now. Requires an explicit start
  # (defaulting to "now" would drop the historical half), but lets the ingest
  # form offer the full range instead of truncating at today.
  temporal_direction: spanning
  sync:
    kind: release
    # The release identity, independent of period_type — WorldPop reissues this
    # revision, not a calendar year. `authority` is a stable machine identifier for
    # whose versioning scheme names the value, never a display label; the display
    # names live on `source` and `providers` below. See ArtifactVersion.
    version:
      value: R2025A
      authority: worldpop
  extents:
    spatial:
      bbox: [-180, -90, 180, 90]
    temporal:
      begin: "2015"
      end: "2030"
      resolution: P1Y
  ingestion:
    plugin: open_climate_service.plugins.datasets.worldpop.WorldPopYearlyPlugin
    params:
      version: global2
      revision: R2025A
      resolution: 100m
      product: total
      variable: pop_total
  units: people
  resolution: 100m x 100m
  source: WorldPop Global2
  source_url: https://hub.worldpop.org/project/categories?id=3
  license: CC-BY-4.0
  providers:
    - name: WorldPop, University of Southampton
      url: https://hub.worldpop.org/
  display:
    colormap: reds
    range: [0.5, 100.0]

