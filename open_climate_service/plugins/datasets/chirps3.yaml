- id: chirps3_precipitation_daily
  name: Precipitation rate (CHIRPS3)
  short_name: Precipitation
  description: >-
    Daily rainfall over land at 5 km, from satellite estimates calibrated against station
    observations. Covers 50 degrees south to 50 degrees north from 1981 onwards.
  standard_name: lwe_precipitation_rate
  variable: precip
  period_type: daily
  sync:
    kind: temporal
    execution: append
  extents:
    spatial:
      bbox: [-180, -50, 180, 50]
    temporal:
      begin: "1981-01-01"
      resolution: P1D
  ingestion:
    plugin: open_climate_service.plugins.datasets.chirps3.CHIRPS3DailyPlugin
  # Daily precipitation as a rate (mm/day): a daily total in mm equals the mean daily
  # rate (the cell is one day), so this is a relabel, not a value change. Storing precip
  # as a flux is what xclim drought indices (SPI/SPEI) consume directly.
  units: mm/d
  cell_methods: "time: mean"
  resolution: 5 km x 5 km
  source: CHIRPS v3
  source_url: https://www.chc.ucsb.edu/data/chirps3
  license: CC-BY-4.0
  providers:
    - name: UCSB Climate Hazards Center
      url: https://www.chc.ucsb.edu/data/chirps
  display:
    colormap: blues
    range: [0.0, 20.0]
    nodata: -9999.0

- id: chirps3_precipitation_monthly
  name: Precipitation rate (CHIRPS3, monthly)
  short_name: Precipitation
  # The mm/d trap is why the warning is in the description and not only in a comment here: the
  # source ships a monthly total, this stores a mean daily rate, and reading one as the other is
  # wrong by a factor of ~30 while looking entirely plausible.
  description: >-
    Monthly rainfall over land at 5 km, from satellite estimates calibrated against station
    observations, from 1981 onwards. Units are mm/d — a MEAN DAILY RATE, not a monthly total.
    Multiply by the days in the month to get the total.
  standard_name: lwe_precipitation_rate
  variable: precip
  period_type: monthly
  sync:
    kind: temporal
    execution: append
  extents:
    spatial:
      bbox: [-180, -50, 180, 50]
    temporal:
      begin: "1981-01-01"
      resolution: P1M
  ingestion:
    plugin: open_climate_service.plugins.datasets.chirps3.CHIRPS3MonthlyPlugin
  # The source raster is a monthly *total* in mm — confirmed against the sum of the same
  # month's dailies, which matches exactly — so the plugin divides by the number of days to
  # store a mean daily rate. Unlike the daily dataset this is a real conversion, not a
  # relabel. mm/d is what every other monthly precipitation dataset here uses, including
  # chirps3_precipitation_monthly_normal_1991_2020 below: storing the raw total under the
  # same units would make a monthly anomaly against that normal wrong by a factor of ~30.
  units: mm/d
  cell_methods: "time: mean"
  resolution: 5 km x 5 km
  source: CHIRPS v3 (monthly)
  source_url: https://www.chc.ucsb.edu/data/chirps3
  license: CC-BY-4.0
  providers:
    - name: UCSB Climate Hazards Center
      url: https://www.chc.ucsb.edu/data/chirps
  display:
    colormap: blues
    range: [0.0, 20.0]
    nodata: -9999.0

# ---------------------------------------------------------------------------
# Climate-normal output templates for the `climate_normal` openEO workflow (normals
# computed from the already-ingested CHIRPS3 store). No ingestion plugin — the data is
# produced by the workflow and published via save_result. Run the workflow on
# chirps3_precipitation_daily; `frequency` selects day-of-year (366) or month (12).
# Monthly values are the mean daily rate per calendar month. The reference period is
# baked into the id (e.g. _1991_2020); add a copy with a new period when one is adopted.
# ---------------------------------------------------------------------------

- id: chirps3_precipitation_daily_normal_1991_2020
  name: Precipitation daily normal (CHIRPS3, 1991–2020)
  short_name: Precipitation daily normal
  description: >-
    Average CHIRPS rainfall for each day of the year over 1991-2020, computed by the climate_normal
    workflow. The baseline an anomaly is measured against.
  variable: precip
  period_type: climatology
  sync:
    kind: static
  units: mm/d
  source: Derived (climate_normal workflow)
  produced_by: climate_normal
  license: CC-BY-4.0
  providers:
    - name: UCSB Climate Hazards Center
      url: https://www.chc.ucsb.edu/data/chirps
  display:
    colormap: blues
    range: [0.0, 20.0]
    nodata: -9999.0

- id: chirps3_precipitation_monthly_normal_1991_2020
  name: Precipitation monthly normal (CHIRPS3, 1991–2020)
  short_name: Precipitation monthly normal
  description: >-
    Average CHIRPS rainfall for each calendar month over 1991-2020, computed by the climate_normal
    workflow. The baseline a monthly anomaly is measured against.
  variable: precip
  period_type: climatology
  sync:
    kind: static
  units: mm/d
  source: Derived (climate_normal workflow)
  produced_by: climate_normal
  license: CC-BY-4.0
  providers:
    - name: UCSB Climate Hazards Center
      url: https://www.chc.ucsb.edu/data/chirps
  display:
    colormap: blues
    range: [0.0, 20.0]
    nodata: -9999.0

# Anomaly output template for the `climate_anomaly` workflow (observed − normal, by
# day-of-year). No ingestion plugin — produced by the workflow; refresh by re-running.
# Relative counterpart of the template above, for `method: "relative"`. A separate template
# because the process changes the unit: percent-of-normal is not a rain rate, and publishing
# one under the other's `mm/d` is refused at save time. Range is percent, so ±100.
- id: chirps3_precipitation_daily_relative_anomaly_1991_2020
  name: Precipitation daily relative anomaly (CHIRPS3, vs 1991–2020 normal)
  short_name: Precipitation anomaly (%)
  description: >-
    How far a day's CHIRPS rainfall sits from its 1991-2020 normal, as a percentage of that normal.
    Negative is drier than usual, positive wetter.
  variable: precip
  period_type: daily
  sync:
    kind: static
  units: "%"
  source: Derived (climate_anomaly workflow, method=relative)
  produced_by: climate_anomaly
  license: CC-BY-4.0
  providers:
    - name: UCSB Climate Hazards Center
      url: https://www.chc.ucsb.edu/data/chirps
  display:
    colormap: RdBu
    range: [-100.0, 100.0]
    nodata: -9999.0

- id: chirps3_precipitation_daily_anomaly_1991_2020
  name: Precipitation daily anomaly (CHIRPS3, vs 1991–2020 normal)
  short_name: Precipitation anomaly
  description: >-
    A day's CHIRPS rainfall minus its 1991-2020 normal. Negative is drier than usual, positive
    wetter.
  variable: precip
  period_type: daily
  sync:
    kind: static
  units: mm/d
  source: Derived (climate_anomaly workflow)
  produced_by: climate_anomaly
  license: CC-BY-4.0
  providers:
    - name: UCSB Climate Hazards Center
      url: https://www.chc.ucsb.edu/data/chirps
  display:
    colormap: RdBu
    range: [-20.0, 20.0]
    nodata: -9999.0

- id: chirps3_precipitation_monthly_anomaly_1991_2020
  name: Precipitation monthly anomaly (CHIRPS3, vs 1991–2020 normal)
  short_name: Precipitation monthly anomaly
  description: >-
    A month's CHIRPS rainfall minus its 1991-2020 normal, as a mean daily rate. Negative is drier
    than usual, positive wetter.
  variable: precip
  period_type: monthly
  sync:
    kind: static
  units: mm/d
  source: Derived (climate_anomaly workflow)
  produced_by: climate_anomaly
  license: CC-BY-4.0
  providers:
    - name: UCSB Climate Hazards Center
      url: https://www.chc.ucsb.edu/data/chirps
  display:
    colormap: RdBu
    # Tighter than the daily ±20: a monthly mean rate averages the extremes away, so a measured
    # Sierra Leone monsoon anomaly sits near ±2.5 mm/d and ±20 renders as blank white. The
    # ERA5-Land monthly template carries the same range for the same reason.
    range: [-10.0, 10.0]
    nodata: -9999.0

- id: chirps3_precipitation_monthly_relative_anomaly_1991_2020
  name: Precipitation monthly relative anomaly (CHIRPS3, vs 1991–2020 normal)
  short_name: Precipitation anomaly (%)
  description: >-
    How far a month's CHIRPS rainfall sits from its 1991-2020 normal, as a percentage of that
    normal. Negative is drier than usual, positive wetter.
  variable: precip
  period_type: monthly
  sync:
    kind: static
  units: "%"
  source: Derived (climate_anomaly workflow, method=relative)
  produced_by: climate_anomaly
  license: CC-BY-4.0
  providers:
    - name: UCSB Climate Hazards Center
      url: https://www.chc.ucsb.edu/data/chirps
  display:
    colormap: RdBu
    range: [-100.0, 100.0]
    nodata: -9999.0
