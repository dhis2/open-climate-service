- id: era5heat_utci_daily
  name: Universal Thermal Climate Index (ERA5-Heat, daily average)
  short_name: Heat Index
  variable: utci
  description: Universal Thermal Climate Index (UTCI) representing human thermal stress and discomfort in outdoor conditions. 
  period_type: daily
  sync:
    kind: temporal
  extents:
    spatial:
      bbox: [-180, -90, 180, 90]
    temporal:
      begin: "1939"
      resolution: P1D
  ingestion:
    plugin: open_climate_service.plugins.datasets.era5_heat.ERA5HeatDailyUTCIPlugin
    params: 
      temporal_aggregation: mean
  units: Degrees Celsius
  resolution: 0.25 deg x 0.25 deg
  source: ERA5-Heat
  source_url: https://cds.climate.copernicus.eu/datasets/derived-utci-historical?tab=overview
  display:
    colormap: YlOrRd
    range: [0, 50]

