[build-system]
requires = ["uv_build>=0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "open_climate_service"

[tool.uv]
override-dependencies = [
    # openeo-pg-parser-networkx requires geojson-pydantic<2.0.0; our project uses >=2.1.0 which is compatible at runtime
    "geojson-pydantic>=2.1.0",
    # openeo-processes-dask pins zarr<=2.18.7 as an unconditional core dep
    # (Open-EO/openeo-processes-dask#376). The cap is vestigial — zarr is only reached
    # through xarray/odc — so we override it to run on a zarr v3 / icechunk backend.
    # The remaining overrides relax other stale upstream lower bounds; safe at runtime.
    "zarr>=3.1.6",
    "pyarrow>=19.0",
    "xarray>=2025.12.0",
    # Held below 2.5 in the lock rather than capped here: numpy 2.5 works only with
    # numba >= 0.67 (xclim's run_length imports it, and older numba refuses 2.5 at import,
    # taking all 176 indicators with it), and it makes netCDF4 1.7.4 — already the latest —
    # emit a binary-incompatibility warning because its wheel predates those headers.
    # Neither is fatal; there is just nothing to gain yet. See PR for the measurements.
    "numpy>=2.2",
    "dask>=2024.1.0",
    "dask-geopandas>=0.4",
    "geopandas>=1.1",
    "xvec>=0.3",
    "rioxarray>=0.17",
    "pystac>=1.10",
]

[project]
name = "open-climate-service"
version = "0.1.0"
requires-python = ">=3.12"
description = "Climate and Earth Observation data API"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "University of Oslo", email = "climate@dhis2.org" }]
readme = "README.md"
keywords = ["dhis2", "climate", "zarr", "stac", "geospatial"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
]
# Base install = the lightweight client. It only talks to a running instance over
# HTTP (discover datasets, list processes/workflows, run process graphs).
dependencies = [
    "httpx>=0.28.1",
    "pystac>=1.10,<2",
]

[project.optional-dependencies]
# Open published datasets as in-memory xarray.Dataset objects from the client
# (reads the remote Zarr store advertised in the STAC collection).
xarray = [
    "xarray>=2025.12.0",
    "zarr>=3.1.6,<4",
    "fsspec>=2024.6.0",
    "aiohttp>=3.10",
]
# Full server stack — required to run your own Open Climate Service instance.
server = [
    "fastapi>=0.100.0",
    "jinja2>=3.1",
    "starlette>=0.27.0",
    "uvicorn>=0.41.0",
    "python-dotenv>=1.0.1",
    "geojson-pydantic>=2.1.0",
    "metpy>=1.7,<2",
    "xstac>=1.0,<2",
    "xarray>=2025.12.0",
    "zarr>=3.1.6,<4",
    "icechunk>=2.0,<3",
    "geozarr-toolkit==0.1.*",
    # 0.1.3 added the `nearest` coarsening method, so categorical pyramids no longer need a
    # local decimation path (carbonplan/topozarr#26). `mode` is still ours — see downloader.
    # The floor is 0.1.4 rather than 0.1.3 for a packaging reason: `topozarr` and
    # `topozarr-core` are separate distributions, and 0.1.3 declared only
    # `topozarr-core>=0.1.0,<0.2` — too loose, since the `nearest` kernel exists only from core
    # 0.1.2. That combination installs cleanly and then fails *at ingest time* with "method must
    # be one of 'mean', 'max', 'min', 'sum'", because the Python layer accepts `nearest` and the
    # Rust kernel rejects it. 0.1.4 pins `topozarr-core==0.1.4` and adds a lockstep release
    # check (carbonplan/topozarr#28), so the pair can no longer be mismatched and OCS no longer
    # needs a `topozarr-core` pin of its own. Do not lower this floor.
    "topozarr>=0.1.4,<0.2",
    "rioxarray>=0.17",
    # Directly imported (shared/time.py, streaming, openeo). Capped to 2.x; pandas
    # 3.0 is a breaking major and not yet validated against this stack.
    "pandas>=2.3,<3",
    "portalocker>=3.2.0",
    "openeo-pg-parser-networkx>=2026.3.3",
    # We depend on the base package and hand-pick the implementation deps rather than
    # using the [implementations] extra. The extra pulls the `gdal` Python bindings,
    # which are never imported by the library yet fail to build unless the system
    # libgdal exactly matches (the macOS/ARM64 dependency hell the old fork avoided).
    # This list mirrors the [implementations] extra minus gdal and the try/except-guarded
    # ml (xgboost) and experimental (rqadeforestation) process groups, which we don't use.
    # If a future release adds a new core import, the registry will fail fast at startup —
    # add the dep here. See Open-EO/openeo-processes-dask CI cap on gdal<3.13.1.
    "openeo-processes-dask>=2026.6.3",
    "dask-geopandas>=0.4",
    "odc-geo>=0.4.1",
    "odc-stac>=0.3.9",
    "planetary-computer>=0.5.1",
    "pystac-client>=0.6.1",
    "stac-validator>=3.3.1",
    "xvec>=0.3",
    "python-multipart>=0.0.29",
    "xclim>=0.61.1",
    # ECMWF's earthkit is a core scientific library here, on the same footing as xclim:
    # process authors (ours and downstream instances') may import these directly, so every
    # component we invite them to use is declared rather than left to a transitive chain.
    # We pick components instead of the `earthkit` meta-package, which would pull
    # earthkit-data[all] (GRIB/BUFR/ODB readers), earthkit-plots (matplotlib, cartopy) and
    # earthkit-hydro for capability we don't use — the same reasoning as the
    # openeo-processes-dask note above. Add a component here when a process needs it.
    #   transforms — climatological normals + anomalies, deaccumulation
    #   meteo      — thermodynamics; auto-registered as processes (openeo/earthkit_processes.py)
    #   utils      — shared helpers, imported by the above
    #
    # earthkit-data (GRIB/BUFR readers) is deliberately absent: nothing here imports it, no
    # other earthkit component requires it outside their own [all]/[test]/[docs] extras, and
    # it is the only dependency that made a Windows install impossible — it requires
    # eccodeslib and eckit, both of which require eckitlib, and none of those three has ever
    # published a Windows wheel (ecmwf/earthkit-data#1105). Every other package in the
    # resolved tree is pure-Python or ships win_amd64, including `eccodes` itself, which is
    # why the failure was so confusing to hit. A plugin that genuinely reads GRIB declares
    # earthkit-data in its own instance dependencies, as it would any other plugin-owned
    # import — see tests/test_scientific_libraries.py for the guard that keeps it out.
    "earthkit-transforms>=1.0",
    "earthkit-meteo>=1.0",
    "earthkit-utils>=1.0",
    # ERA5-Land plugin runtime deps — the CDS API client and the netCDF4 engine its
    # downloads are read with.
    "ecmwf-datastores-client>=0.4",
    "netcdf4>=1.7",
    "apscheduler>=3.11,<4",
]

[project.urls]
Repository = "https://github.com/dhis2/open-climate-service"
Documentation = "https://github.com/dhis2/open-climate-service/tree/main/docs"
"Bug Tracker" = "https://github.com/dhis2/open-climate-service/issues"
Changelog = "https://github.com/dhis2/open-climate-service/releases"

[project.scripts]
climate-service = "open_climate_service.cli:main"

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["vendor/"]

[tool.ruff.lint]
fixable = ["ALL"]
select = ["E", "W", "F", "I", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]
"**/__init__.py" = ["D104"]
"open_climate_service/**/*.py" = ["D102", "D105", "D107"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
strict_equality = true
mypy_path = ["."]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["apscheduler", "apscheduler.*", "rasterio.*", "pygeofilter.*", "requests.*", "geopandas.*", "earthkit.*", "metpy.*", "matplotlib.*", "yaml", "xproj", "topozarr.*", "geozarr_toolkit", "xstac", "openeo_pg_parser_networkx", "openeo_pg_parser_networkx.*", "openeo_processes_dask", "openeo_processes_dask.*", "dask_geopandas", "dask_geopandas.*", "xclim", "xclim.*"]
ignore_missing_imports = true

[tool.pyright]
include = ["open_climate_service", "tests"]
exclude = ["**/.venv"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
useLibraryCodeForTypes = true
reportPrivateUsage = false
reportUnusedFunction = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
reportMissingTypeArgument = false
reportMissingTypeStubs = false
reportUnknownLambdaType = false
reportMissingImports = "warning"
reportMissingModuleSource = false

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "mypy>=1.19.1",
    "pandas-stubs>=2.3,<3",
    "pyright>=1.1.408",
    "pytest>=9.0.3",
    "ruff>=0.15.2",
    "types-shapely>=2.1,<3",
    "watchfiles>=1.2.0",
]
