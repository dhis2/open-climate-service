services:
  api:
    build: .
    env_file: .env
    ports:
      - "${PORT:-9000}:${PORT:-9000}"
    init: true
    restart: unless-stopped
    volumes:
      # Operator-provided instance config (extent, data_dir). .env points
      # GEOSERVICE_CONFIG at ./geoservice.yaml, i.e. /app inside the
      # container. Create it first: cp geoservice.yaml.example geoservice.yaml
      - ./geoservice.yaml:/app/geoservice.yaml:ro
      - data:/app/data

volumes:
  data:
